<footer class="site-footer h-card">
  <data class="u-url" href="{{ '/' | relative_url }}"></data>
  <div class="wrapper">
    <p class="site-footer__text">
      <a class="u-url" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      {% if site.description %}
        <span aria-hidden="true"> · </span>
        <span class="p-summary">{{ site.description | escape }}</span>
      {% endif %}
    </p>
  </div>
</footer>
